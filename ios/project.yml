name: VYSNER
options:
  bundleIdPrefix: com.vysner
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  VYSNER:
    type: application
    platform: iOS
    sources:
      - path: VYSNER
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vysner.app
        PRODUCT_NAME: VYSNER
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VYSNER
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_NSCameraUsageDescription: "VYSNER nutzt die Kamera, um Fotos und Mängel auf der Baustelle zu dokumentieren."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "VYSNER braucht Zugriff auf deine Fotos, um Bilder zu Punkten und Mängeln hinzuzufügen."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
